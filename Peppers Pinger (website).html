<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pepper-Dev Ultimate Pinger</title>
<style>
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #0f0f0f;
    color: #e0e0e0;
    display: flex;
    min-height: 100vh;
    margin: 0;
}
.sidebar {
    width: 200px;
    background: #1a1a1a;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    border-right: 2px solid #333;
}
.sidebar h2 { color: #bb86fc; margin-bottom: 10px; font-size: 1.2em; }
.sidebar button {
    background: #2c2c2c;
    color: #fff;
    border: none;
    padding: 10px;
    border-radius: 8px;
    cursor: pointer;
    text-align: left;
}
.sidebar button:hover { background: #444; }
.sidebar input {
    padding: 8px; border-radius: 8px; border: 1px solid #333; background: #2c2c2c; color: #fff; margin-bottom: 5px;
}
.main {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px;
}
.container {
    background: #1e1e1e;
    padding: 30px;
    border-radius: 20px;
    width: 100%;
    max-width: 650px;
    text-align: center;
    box-shadow: 0 0 50px rgba(100,100,255,0.4);
}
h1 { font-size: 1.8em; margin-bottom: 20px; color: #bb86fc; }
input, button {
    padding: 12px; font-size: 16px; width: 100%; border-radius: 10px;
    border: none; margin-bottom: 10px;
}
input { background: #2c2c2c; color: #fff; border: 1px solid #333; }
input:focus { outline: none; border-color: #bb86fc; box-shadow: 0 0 10px #bb86fc; }
button { background: #bb86fc; color: #121212; cursor: pointer; }
button:hover { background-color: #9a4dff; }
#status-container { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 10px; }
.status-dot { width: 15px; height: 15px; border-radius: 50%; background-color: gray; transition: 0.3s; }
#progress-bar-container { width: 100%; background-color: #333; border-radius: 10px; overflow: hidden; margin-top: 10px; }
.progress-bar { height: 15px; width: 0%; background-color: #bb86fc; transition: width 0.1s; }
#speed-info { font-size: 0.95em; color: #aaa; margin-top: 5px; }
</style>
</head>
<body>

<div class="sidebar">
    <h2>Presets</h2>
    <div id="preset-buttons"></div>
    <input type="text" id="new-preset" placeholder="Add custom URL">
    <button onclick="addPreset()">Add Preset</button>
</div>

<div class="main">
<div class="container">
    <h1>Pepper-Dev Pinger</h1>
    <input type="text" id="url" placeholder="example.com" onkeypress="if(event.key==='Enter'){pingWebsite()}">
    <button onclick="pingWebsite()">Ping Website</button>
    <button onclick="sendCustomData()">Send Custom Data</button>

    <div id="status-container">
        <div class="status-dot" id="status-dot"></div>
        <span id="result-text">Awaiting input...</span>
    </div>

    <div id="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>
    <div id="speed-info"></div>
</div>
</div>

<script>
let presets = [
    "https://discord.com",
    "https://youtube.com",
    "https://doxbin.com",
    "https://mewbin.ru",
    "https://doxbin.net",
    "https://gangmonkeys.com"
];

// Load saved presets
if (localStorage.getItem('customPresets')) {
    presets = JSON.parse(localStorage.getItem('customPresets'));
}

function savePresets() {
    localStorage.setItem('customPresets', JSON.stringify(presets));
}

function renderPresets() {
    const container = document.getElementById('preset-buttons');
    container.innerHTML = '';
    presets.forEach(url => {
        const btn = document.createElement('button');
        btn.textContent = url;
        btn.onclick = () => document.getElementById('url').value = url;
        container.appendChild(btn);
    });
}
renderPresets();

function addPreset() {
    const urlInput = document.getElementById('new-preset');
    let url = urlInput.value.trim();
    if (!url) return alert("Enter a valid URL!");
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
    if (!presets.includes(url)) {
        presets.push(url);
        savePresets();
        renderPresets();
    }
    urlInput.value = '';
}

// Reliable ping with timeout
async function fetchWithTimeout(url, timeout = 5000) {
    return new Promise((resolve, reject) => {
        const timer = setTimeout(() => reject(new Error('Timeout')), timeout);
        fetch(url, { method: 'GET', mode: 'no-cors' })
            .then(() => { clearTimeout(timer); resolve(); })
            .catch(err => { clearTimeout(timer); reject(err); });
    });
}

async function pingWebsite() {
    let url = document.getElementById('url').value.trim();
    const resultText = document.getElementById('result-text');
    const statusDot = document.getElementById('status-dot');

    if (!url) { resultText.textContent = "Enter a website URL"; return; }
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;

    resultText.textContent = "Pinging...";
    statusDot.style.backgroundColor = 'yellow';

    const startTime = performance.now();
    try {
        await fetchWithTimeout(url, 5000);
        const endTime = performance.now();
        const ping = Math.round(endTime - startTime);
        resultText.textContent = `${url} is reachable (${ping}ms)`;
        statusDot.style.backgroundColor = 'limegreen';
    } catch {
        resultText.textContent = `${url} might not be reachable`;
        statusDot.style.backgroundColor = 'red';
    }
}

async function sendCustomData() {
    let url = document.getElementById('url').value.trim();
    if (!url) { alert("Please enter a website URL!"); return; }
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;

    const mb = prompt("Enter amount of megabytes to send:", "1");
    const mbNum = parseFloat(mb);
    if (isNaN(mbNum) || mbNum <= 0) { alert("Invalid number"); return; }

    const dataSize = mbNum * 1024 * 1024;
    const payload = new Uint8Array(dataSize);
    const resultText = document.getElementById('result-text');
    const statusDot = document.getElementById('status-dot');
    const progressBar = document.getElementById('progress-bar');
    const speedInfo = document.getElementById('speed-info');

    resultText.textContent = `Sending ${mbNum}MB...`;
    statusDot.style.backgroundColor = 'yellow';
    progressBar.style.width = '0%';
    speedInfo.textContent = '';

    const chunkSize = 1024 * 64;
    let sent = 0;
    const startTime = performance.now();

    try {
        for (let i = 0; i < dataSize; i += chunkSize) {
            const chunk = payload.slice(i, i + chunkSize);
            await fetch(url, { method: 'POST', body: chunk });
            sent += chunk.length;
            progressBar.style.width = `${Math.min(100, (sent / dataSize) * 100)}%`;
        }
        const endTime = performance.now();
        const duration = ((endTime - startTime)/1000).toFixed(2);
        const speed = ((dataSize / 1024 / 1024) / duration).toFixed(2);
        resultText.textContent = `Sent ${mbNum}MB to ${url}`;
        statusDot.style.backgroundColor = 'limegreen';
        speedInfo.textContent = `Time: ${duration}s | Speed: ${speed} MB/s`;
        progressBar.style.width = '100%';
    } catch (error) {
        resultText.textContent = `Failed to send ${mbNum}MB to ${url}`;
        statusDot.style.backgroundColor = 'red';
        progressBar.style.width = '0%';
        speedInfo.textContent = '';
    }
}
</script>
</body>
</html>
